name: 'SDP CI Integration'
description: 'Sends CI/CD data from GitHub Actions to OpenText SDP / SDM.'
branding:
  color: blue
  icon: arrow-up-circle
inputs:
  octaneUrl:
    description: 'Url of OpenText SDP / SDM instance'
    required: true
  octaneSharedSpace:
    description: 'Shared Space ID'
    required: true
  octaneWorkspace:
    description: 'Workspace ID'
    required: true
  octaneClientId:
    description: "OpenText SDP / SDM API Access Client ID"
    required: true
  octaneClientSecret:
    description: 'OpenText SDP / SDM API Access Client Secret'
    required: true
  gitHubToken:
    description: 'GitHub PAT'
    required: true
  serverBaseUrl:
    description: 'URL of the organization/repository in GitHub'
    required: true
  pipelineNamePattern:
    description: 'Pattern to build pipeline names'
    required: true
  preservePipelineNames:
    description: 'Do not rename existing pipelines based on pipelineNamePattern'
    required: false
    default: false
  flatPipelineMode:
    description: 'Do not create branch/child pipelines; report runs directly against the parent pipeline'
    required: false
    default: false
  runNamePattern:
    description: 'Already-resolved label used to prefix the run/build number (e.g. a microservice/component name). Falls back to the resolved pipeline name if not set.'
    required: false
  testLevel:
    description: 'Value of the Test_Level field set on JUnit test results sent to the product (e.g. "System Test"). Defaults to "Unit Test" if not set.'
    required: false
  testType:
    description: 'Value of the Test_Type field set on JUnit test results sent to the product (e.g. "Functional"). Defaults to "Sanity" if not set.'
    required: false
  unitTestResultsGlobPattern:
    description: 'Pattern to search unit test result report files in artifacts'
    required: false
  gherkinTestResultsGlobPattern:
    description: 'Pattern to search Gherkin test result report files in artifacts'
    required: false
  testingFramework:
    description: 'Testing framework to use for the test runner'
    required: false
  logLevel:
    description: 'Sets the log level (1-5): 1-trace, 2-debug, 3-info, 4-warn, 5-error'
    required: false
    default: 3
runs:
  using: 'node24'
  main: 'dist/index.js'